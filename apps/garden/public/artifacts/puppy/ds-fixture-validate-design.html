<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>fixture-validate-design</title>
<style>
/* Maquette d'un ensemble Design System : réglages à gauche (lecture seule, tirés du Référentiel d'interface), aperçus Typeform à droite. */
:root{
  color-scheme: light;
  --bg:#F3F3F6; --surface:#FFFFFF; --fg:#1B1E33; --muted:#5D6178; --line:#D9DAE3; --accent:#202546; --accent-ink:#FFFFFF;
  --warn-bg:#FCE8E3; --warn-ink:#8A2A0E; --ok-bg:#E3F1E8; --ok-ink:#1E5B36; --info-bg:#E8EAF6; --info-ink:#2D3463;
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Berkeley Mono", "Commit Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12131C; --surface:#1B1D2A; --fg:#ECEDF5; --muted:#A2A5BC; --line:#2E3145; --accent:#F7C338; --accent-ink:#202546;
  --warn-bg:#3B1A12; --warn-ink:#F7B39E; --ok-bg:#183524; --ok-ink:#9FE0B8; --info-bg:#232744; --info-ink:#C9CDF2; color-scheme: dark } }
:root[data-theme="dark"]{
  --bg:#12131C; --surface:#1B1D2A; --fg:#ECEDF5; --muted:#A2A5BC; --line:#2E3145; --accent:#F7C338; --accent-ink:#202546;
  --warn-bg:#3B1A12; --warn-ink:#F7B39E; --ok-bg:#183524; --ok-ink:#9FE0B8; --info-bg:#232744; --info-ink:#C9CDF2; color-scheme: dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--font-ui)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:22px 48px;display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:600 clamp(22px,3vw,30px)/1.15 var(--font-mono);letter-spacing:-.02em}
.lede{margin:0;max-width:78ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--font-mono);padding:6px 8px;border:1px solid var(--line);background:var(--surface)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.chip.bad{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info-ink);border-color:transparent}
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){ .layout{grid-template-columns:minmax(0,1fr)} }
.panel{background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;gap:14px;min-width:0}
.grp{display:grid;gap:6px}
.grp .gl{font:500 11.5px/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.rule .k{font:12.5px var(--font-mono);color:var(--fg);overflow-wrap:anywhere}
.rule .v{display:flex;align-items:center;gap:6px;justify-content:flex-end;font:12.5px var(--font-mono);text-align:right;overflow-wrap:anywhere}
.rule .v i{width:16px;height:16px;border:1px solid var(--line);flex:none}
.rule .m{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 10.5px/1 var(--font-mono);padding:3px 6px;letter-spacing:.03em}
.tag.Validé{background:var(--ok-bg);color:var(--ok-ink)} .tag.Déprécié{background:var(--line);color:var(--muted)}
.tag.drift{background:var(--warn-bg);color:var(--warn-ink)} .tag.fall{background:var(--info-bg);color:var(--info-ink)}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{display:grid;grid-template-columns:22px auto;gap:2px 8px;align-items:center;font:12px var(--font-mono)}
.tok i{width:22px;height:22px;border:1px solid var(--line);grid-row:span 2}
.tok span{color:var(--muted);font-size:11px}
.preview{display:grid;gap:14px;min-width:0}
.label{font:500 12px/1.3 var(--font-mono);color:var(--muted);letter-spacing:.03em}
figure{margin:0;display:grid;gap:7px;min-width:0}
.desk{width:100%;max-width:100%;aspect-ratio:16/9;border:1px solid var(--line);overflow:hidden;container-type:inline-size}
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.phone{aspect-ratio:9/17;max-width:100%;border:1px solid var(--line);border-radius:20px;overflow:hidden;container-type:inline-size}
.out{background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;gap:8px;min-width:0}
.out h2{margin:0;font:600 14px var(--font-mono)}
.out p{margin:0;color:var(--muted);font-size:13px;max-width:80ch}
pre{margin:0;font:12px/1.5 var(--font-mono);background:var(--bg);border:1px solid var(--line);padding:12px;overflow-x:auto}
.note{font:12px var(--font-mono);color:var(--muted)}
/* Simulation Typeform (reprise de l'atelier du thème) : toutes les valeurs viennent des variables --tf-* */
.tf{position:relative;width:100%;height:100%;font-family:var(--tf-font);color:var(--tf-q);background:var(--tf-bg);display:flex;flex-direction:column;overflow:hidden}
.tf .bar{height:3px;background:color-mix(in srgb,var(--tf-q) 14%,transparent)}
.tf .bar i{display:block;height:100%;background:var(--tf-a)}
.tf .body{flex:1;display:flex;padding:0 9cqw;align-items:center;min-height:0}
.tf .col{flex:1;display:grid;gap:3.2cqw;min-width:0;justify-items:start;text-align:left}
.tf .col.c{justify-items:center;text-align:center}
.tf h3{margin:0;font-weight:400;line-height:1.22;font-size:var(--tf-qsize)}
.tf h3.screen{font-size:var(--tf-ssize)}
.tf .num{font-size:.62em;color:var(--tf-a);margin-right:2cqw;vertical-align:.15em}
.tf .input{width:100%;border-bottom:1px solid var(--tf-a);color:color-mix(in srgb,var(--tf-a) 55%,transparent);font-size:5.4cqw;padding-bottom:1.6cqw}
.tf .row{display:flex;align-items:center;gap:3cqw;flex-wrap:wrap}
.tf .btn{background:var(--tf-btn-bg);color:var(--tf-btn-ink);border:1.5px solid var(--tf-btn);font-weight:700;font-size:4.4cqw;padding:2.4cqw 4.6cqw;border-radius:var(--tf-rbtn)}
.tf .hint{font-size:3.2cqw;opacity:.7}
.tf .choices{display:grid;gap:1.8cqw;width:100%}
.tf .choice{display:flex;align-items:center;gap:2.6cqw;border:1px solid color-mix(in srgb,var(--tf-a) 55%,transparent);background:color-mix(in srgb,var(--tf-a) 9%,transparent);color:var(--tf-a);padding:1.8cqw 2.6cqw;font-size:4.2cqw;border-radius:var(--tf-r)}
.tf .choice b{font-weight:500;font-size:3.2cqw;border:1px solid color-mix(in srgb,var(--tf-a) 60%,transparent);padding:.4cqw 1.4cqw;border-radius:var(--tf-r)}
.tf .choice.on{background:color-mix(in srgb,var(--tf-a) 24%,transparent)}
.tf .logo{border:1px dashed color-mix(in srgb,var(--tf-q) 50%,transparent);color:color-mix(in srgb,var(--tf-q) 70%,transparent);font-size:2.6cqw;padding:1.6cqw 3cqw}
.tf .brand{position:absolute;left:4cqw;bottom:4cqw;font-size:2.8cqw;opacity:.6;border:1px solid color-mix(in srgb,var(--tf-q) 40%,transparent);padding:.8cqw 1.6cqw;border-radius:2cqw}
.tf .nav{position:absolute;right:4cqw;bottom:4cqw;display:flex;gap:2px}
.tf .nav span{background:var(--tf-btn-bg);color:var(--tf-btn-ink);border:1.5px solid var(--tf-btn);width:7cqw;height:7cqw;display:grid;place-items:center;font-size:3.6cqw;border-radius:var(--tf-r)}
.desk .tf .body{padding:0 12cqw}
.desk .tf h3{font-size:calc(var(--tf-ssize) * .48)} .desk .tf .btn{font-size:1.7cqw;padding:1cqw 2cqw}
.desk .tf .hint{font-size:1.3cqw} .desk .tf .col{gap:1.8cqw} .desk .tf .logo{font-size:1.2cqw;padding:.8cqw 1.6cqw} .desk .tf .brand{font-size:1.1cqw;left:2cqw;bottom:2cqw}
