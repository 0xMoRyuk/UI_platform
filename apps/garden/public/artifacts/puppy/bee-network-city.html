*{box-sizing:border-box}
body{background:var(--ground);color:var(--text);font-family:var(--display);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

@keyframes draw{to{stroke-dashoffset:0}}

/* root column */
.root{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;position:relative;z-index:1}

.fan{position:relative;z-index:1;min-height:560px}

.leaf .t{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.leaf .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.badge{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--line-soft);border:1px solid var(--line);padding:1px 7px;border-radius:5px;white-space:nowrap}
.badge b{color:var(--honey);font-weight:500}
.mark{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.mark.special{color:var(--special)} .mark.pivot{color:var(--pivot)}
.leaf:hover .t,.leaf:focus-visible .t{color:var(--honey)}

.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 32px;background:var(--panel);border:1px solid var(--line-soft);border-radius:18px;padding:22px 26px}

.detail .side{display:flex;flex-direction:column;gap:12px;font-size:13px}

.detail .side dd{margin:2px 0 0;color:var(--muted)}
.detail .side dd code{font-family:var(--mono);font-size:12px;color:var(--text);word-break:break-all}
.limit{border-left:2px solid var(--special);padding-left:12px;color:var(--text)}
.also a{color:var(--honey);text-decoration:none;cursor:pointer}
.also a:hover{text-decoration:underline}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);align-items:center}

function P(x,y,z){ const [a,b]=rotXY(x,y); return [(a-b)*U*0.866, (a+b)*U*0.5 - z*H]; }
const pts = arr => arr.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
function box(x,y,w,z0,z1){
  // corners in world space; pick visible faces after rotation by comparing projected depth
  const c=[[x,y],[x+w,y],[x+w,y+w],[x,y+w]];
  const top=c.map(([a,b])=>P(a,b,z1));
  const faces=[];
  for(let k=0;k<4;k++){
    const [a1,b1]=c[k],[a2,b2]=c[(k+1)%4];

  }

}

function draw(){

  const all=[]; towers.forEach(t=>{ const c=[[t.x,t.y],[t.x+t.w,t.y+t.w]]; all.push(...c.map(([a,b])=>P(a,b,0)), P(t.x,t.y,height(t.b))); });

  D.forEach((d,di)=>{ const p=d.plot; out+=`<polygon class="plot" data-d="${di}" points="${pts([[p.x,p.y],[p.x+p.w,p.y],[p.x+p.w,p.y+p.w],[p.x,p.y+p.w]].map(([a,b])=>P(a,b,0)))}"/>`; });
  // streets: child → parent, L-shaped on the ground
  towers.forEach(t=>{ const par=tByName[t.b.rattachement]; if(!par) return;
    const a=[t.x+t.w/2,t.y+t.w/2], b=[par.x+par.w/2,par.y+par.w/2];

    out+=`<polyline class="street${hot?" hot":""}" points="${pts([P(a[0],a[1],0),P(b[0],a[1],0),P(b[0],b[1],0)])}"/>`; });
  // district labels at each plot's front corner
  D.forEach(d=>{ const p=d.plot; const corners=[[p.x,p.y+p.w],[p.x+p.w,p.y+p.w],[p.x+p.w,p.y],[p.x,p.y]].map(([a,b])=>P(a,b,0));
    const front=corners.reduce((m,c)=>c[1]>m[1]?c:m); out+=`<text class="dlbl" x="${front[0].toFixed(0)}" y="${(front[1]+16).toFixed(0)}" text-anchor="middle">${esc(d.name)} · ${d.items.length}</text>`; });

  // towers, painter's order (far to near)
  const order=towers.slice().sort((a,b)=>{ const pa=P(a.x+a.w/2,a.y+a.w/2,0)[1], pb=P(b.x+b.w/2,b.y+b.w/2,0)[1]; return pa-pb; });
  const labels=[];
  order.forEach(t=>{
    const b=t.b, h=height(b), inv=isInv(b);
    const e=b.state? Object.entries(b.state.counts||{}).filter(x=>x[1]>0).sort((a,c)=>c[1]-a[1]) : [];
    const tot=e.reduce((a,x)=>a+x[1],0);
    const bands = tot ? e.map(([k,v],i)=>({k,v,c:PAL[i%PAL.length]})) : [{c: inv?invCol():keepCol(), v:1}];
    const sum=bands.reduce((a,x)=>a+x.v,0);

    <div class="statelegend">${e.map(([k,v],i)=>`<span style="--c:${PAL[i%PAL.length]}">${esc(k)||"vide"} <b>${nf(v)}</b></span>`).join("")}</div></dd>`;
}
function panelOverview(){
  const total=BASES.reduce((a,b)=>a+(b.row_count||0),0), rc=FALLBACK_DATA.registry_counts||{};
  $("#panel").innerHTML=`<div class="kicker"><span>vue d'ensemble</span></div>
    <h3>${BASES.length} bases, ${nf(total)} fiches</h3>
    <dl><div><dt>Registre</dt><dd>${rc["À garder"]??"—"} à garder · ${rc["À investiguer"]??"—"} à investiguer · ${rc["pruned"]??"—"} pruned (non dessinées)</dd></div>
    <div><dt>Quartiers</dt><dd class="districts">${D.map((d,i)=>`<button data-d="${i}">${esc(d.name)} · ${d.items.length}</button>`).join("")}</dd></div>
    <div><dt>Lecture</dt><dd>Survole une tour pour son nom, clique pour son détail. Un quartier cliqué éteint les autres.</dd></div></dl>`;
  $("#panel").querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{ hotDistrict=+b.dataset.d; sel=D[hotDistrict].head||null; if(sel) panelBase(sel); draw(); }));
}
function panelBase(b){
  const titles = b.pii_excluded ? `<dd>Exclus : la base porte des personnes. Comptes seulement.</dd>` :
    (b.sample_titles||[]).length ? `<dd><ul class="titles">${b.sample_titles.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></dd>` : `<dd>Aucun titre relevé.</dd>`;
  $("#panel").innerHTML=`<div class="kicker">${isInv(b)?`<span class="chip inv">à investiguer</span>`:`<span class="chip al-exec">à garder</span>`}<span>${chain(b).map(esc).join(" › ")}</span></div>
    <h3>${esc(b.base)}</h3><div class="bignum">${nf(b.row_count)}<small>fiches</small></div>
    <dl><div><dt>État</dt>${stateBlock(b)}</div><div><dt>Dernières fiches</dt>${titles}</div>
    ${(kids[b.base]||[]).length?`<div><dt>Sous-bases</dt><dd>${kids[b.base].map(x=>esc(x.base)).join(" · ")}</dd></div>`:""}
    <div><dt>data_source_id</dt><dd><code>${esc(b.data_source_id||"—")}</code></dd></div>
    <div><dd><a href="#" id="back" style="color:var(--honey)">← vue d'ensemble</a></dd></div></dl>`;
  $("#back").addEventListener("click",e=>{ e.preventDefault(); sel=null; hotDistrict=null; panelOverview(); draw(); });
}
function select(b){ sel=b; const t=tByName[b.base]; hotDistrict = t && t.d>=0 ? t.d : null; panelBase(b); draw(); }

$("#rotL").addEventListener("click",()=>{ rot=(rot+3)%4; draw(); });
$("#rotR").addEventListener("click",()=>{ rot=(rot+1)%4; draw(); });
$("#lbls").addEventListener("click",e=>{ allLabels=!allLabels; e.currentTarget.setAttribute("aria-pressed",allLabels); draw(); });
$("#gen").textContent=FALLBACK_DATA.generated; $("#ver").textContent=FALLBACK_DATA.agent_version;
panelOverview(); draw();
</script>
